<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel | Rei dos Imóveis</title>
<meta name="robots" content="noindex">
<link rel="icon" href="coroa.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14120f;--ink2:#1d1a15;--gold:#BB9B63;--gold2:#d6be8e;--gold3:#8f7444;--paper:#f7f3ec;--card:#fff;--line:#e6decf;--txt:#1d1b17;--muted:#71695c;--ok:#2f7a55;--okbg:#e6f2ec;--warn:#9a6a12;--warnbg:#fbf1dc;--err:#a3452d;--errbg:#fbeae5;--blue:#33597f;--bluebg:#e7eef6;--serif:'Cinzel',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--txt);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}a{color:inherit;text-decoration:none}
.ico{width:20px;height:20px;flex:none}
/* login */
.login{min-height:100svh;display:grid;place-items:center;background:radial-gradient(120% 80% at 20% 0%,#2a251d,#14120f 60%);padding:20px}
.login .box{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:36px 30px;text-align:center}
.login img{height:64px;margin:0 auto 20px}
.login h1{font-family:var(--serif);font-weight:500;font-size:32px}
.login p{color:var(--muted);font-size:14px;margin:6px 0 22px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;text-align:left}
.f label{font-size:12.5px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 13px;background:#fbf9f5;outline:0;width:100%}
.f textarea{height:auto;min-height:110px;padding:11px 13px;resize:vertical;line-height:1.55}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:14px;transition:.2s;white-space:nowrap}
.b-ouro{background:var(--gold);color:#16130e}.b-ouro:hover{background:var(--gold2)}
.b-escuro{background:var(--ink);color:#fff}.b-escuro:hover{background:#2a261f}
.b-linha{border:1.5px solid var(--line);background:#fff}.b-linha:hover{border-color:var(--gold)}
.b-zap{background:#1f8a4c;color:#fff}.b-zap:hover{background:#18743f}
.b-erro{color:var(--err);border:1.5px solid #ecc9bf;background:#fff}
.demo-tag{display:inline-block;background:var(--warnbg);color:var(--warn);font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;margin-top:16px}
/* app */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100svh}
.side{background:var(--ink);color:#d8d0c1;padding:22px 14px;position:sticky;top:0;height:100svh;display:flex;flex-direction:column;gap:4px}
.side .lg{padding:4px 10px 22px}.side .lg img{height:46px}
.side button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14.5px;text-align:left;transition:.2s;color:#cfc7b8}
.side button:hover{background:rgba(255,255,255,.06);color:#fff}
.side button.on{background:rgba(185,155,101,.16);color:var(--gold2)}
.side button b{margin-left:auto;background:var(--gold);color:#16130e;font-size:11.5px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.side .pe{margin-top:auto;font-size:13px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.08)}
.side .pe a,.side .pe button{color:#cfc7b8;padding:6px 0;font-size:13px}
.main{padding:28px 34px 60px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.1}
.top .sub{color:var(--muted);font-size:14px}
.top .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi b{display:block;font-family:var(--serif);font-size:40px;font-weight:500;line-height:1.1;margin-top:4px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.dest{background:var(--ink);color:#fff;border-color:var(--ink)}.kpi.dest span,.kpi.dest small{color:#bdb4a4}.kpi.dest b{color:var(--gold2)}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.card h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.barras{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.barras i{display:block;width:100%;max-width:26px;background:var(--gold);border-radius:6px 6px 2px 2px;min-height:3px;transition:height .6s}
.barras small{font-size:10.5px;color:var(--muted)}
.rank li{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rank li:first-child{border-top:0}
.rank li span{flex:1}.rank li em{font-style:normal;font-weight:800}
.rank .bar{height:6px;background:var(--paper);border-radius:3px;flex:1;max-width:120px;overflow:hidden}.rank .bar i{display:block;height:100%;background:var(--gold)}
.lista{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line);cursor:pointer;transition:background .2s}
.item:first-child{border-top:0}
.item:hover{background:#faf7f1}
.av{width:42px;height:42px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:800;color:var(--gold3);position:relative}
.av.novo::after{content:"";position:absolute;right:0;top:0;width:11px;height:11px;border-radius:50%;background:#c2412d;border:2px solid #fff}
.item b{font-size:15px}.item .s{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .dir{text-align:right;font-size:12.5px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.02em}
.t-novo{background:var(--errbg);color:var(--err)}.t-atendimento{background:var(--bluebg);color:var(--blue)}.t-proposta{background:var(--warnbg);color:var(--warn)}.t-fechado{background:var(--okbg);color:var(--ok)}.t-perdido{background:#eee;color:#777}
.tipo{background:var(--paper);color:var(--gold3)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filtros input,.filtros select{height:42px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;outline:0}
.filtros input{flex:1;min-width:200px}
.pill{height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.vazio{text-align:center;padding:50px 20px;color:var(--muted)}
.vazio b{display:block;font-family:var(--serif);font-size:26px;font-weight:500;color:var(--txt)}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(20,18,15,.45);z-index:40;opacity:0;transition:.25s}
.ov.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:41;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .hd{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer .hd h2{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1}
.drawer .hd .x{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none}
.drawer .bd{padding:20px 24px;overflow:auto;flex:1}
.det{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0 18px}
.det div{background:#fff;padding:11px 13px}.det div.l{grid-column:span 2}
.det span{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.det b{font-size:14.5px;word-break:break-word}
.bts{display:flex;gap:8px;flex-wrap:wrap}
.notas li{list-style:none;background:var(--paper);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.notas li small{display:block;color:var(--muted);font-size:11.5px}
.tabela{width:100%;border-collapse:collapse}
.tabela th{font-size:12px;text-align:left;color:var(--muted);font-weight:800;padding:10px;border-bottom:1px solid var(--line)}
.tabela td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
.tabela img{width:64px;height:48px;object-fit:cover;border-radius:8px}
.tabela input,.tabela select{height:38px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;max-width:160px}
.sw{position:relative;width:44px;height:26px;border-radius:13px;background:#d8d0c1;transition:.2s;flex:none;display:inline-block}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 16px 40px rgba(0,0,0,.3);z-index:60;max-width:340px;transform:translateY(20px);opacity:0;transition:.3s;font-size:14px}
.toast.on{transform:none;opacity:1}.toast b{display:block;color:var(--gold2)}
.aviso{background:var(--warnbg);color:#6d4c0e;border-radius:14px;padding:12px 16px;font-size:13.5px;margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aviso button{text-decoration:underline;font-weight:700}
.grid-c{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.cpost{display:flex;flex-direction:column;overflow:hidden;padding:0}
.cpost img{aspect-ratio:16/9;object-fit:cover;width:100%}
.cpost .in{padding:16px}
.cpost b{font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.15;display:block;margin:4px 0}
.cpost small{color:var(--muted);font-size:12.5px}
.foto-prev{width:120px;height:150px;border-radius:14px;object-fit:cover;background:var(--paper);border:1px solid var(--line)}
.mob-top{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:.3s}.side.on{transform:none}
  .mob-top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--ink);position:sticky;top:0;z-index:30}.mob-top img{height:36px}.mob-top button{color:#fff;margin-left:auto}
  .main{padding:20px 16px 50px}.kpis{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
  .tabela thead{display:none}.tabela tr{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}.tabela td{border:0;padding:2px 0}.tabela td:first-child{grid-row:span 4}
  .top h1{font-size:30px}
}

/* ===== imóveis (cadastro estilo Tecimob) ===== */
.im-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.im-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .25s,transform .25s}
.im-card:hover{box-shadow:0 16px 36px rgba(20,18,15,.1);transform:translateY(-2px)}
.im-card .ft{position:relative;aspect-ratio:16/10;background:#eee8dd}
.im-card .ft img{width:100%;height:100%;object-fit:cover}
.im-card .ft .cod{position:absolute;left:10px;top:10px;background:rgba(20,18,15,.82);color:#fff;font-size:12px;font-weight:800;padding:5px 9px;border-radius:8px}
.im-card .ft .st{position:absolute;right:10px;top:10px;background:#fff;font-size:12px;font-weight:800;padding:5px 9px;border-radius:8px}
.im-card .ft .st.off{background:#f3d9d2;color:var(--err)}
.im-card .ft .nf{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px}
.im-card .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.im-card .tx b{font-size:15.5px;line-height:1.3}
.im-card .tx small{color:var(--muted);font-size:13px}
.im-card .tx .pr{font-family:var(--serif);font-size:22px;color:var(--gold3);margin-top:4px}
.im-card .tx .sp{font-size:12.5px;color:var(--muted);font-weight:600}
.im-card .ac{display:flex;gap:6px;padding:0 16px 16px;align-items:center}
.im-card .ac .btn{height:38px;padding:0 12px;font-size:13px}
.im-card .ac .sw{margin-left:auto}
.vazio-im{background:#fff;border:1.5px dashed var(--line);border-radius:20px;padding:50px 20px;text-align:center}
.vazio-im h3{font-family:var(--serif);font-weight:500;font-size:28px}
.vazio-im p{color:var(--muted);margin:6px auto 18px;max-width:420px}
.ed{display:grid;grid-template-columns:210px 1fr;gap:24px;align-items:start}
.ed-nav{position:sticky;top:20px;display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}
.ed-nav a{padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center}
.ed-nav a i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:11.5px;color:var(--gold3)}
.ed-nav a:hover{background:var(--paper);color:var(--txt)}
.ed-sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 22px 10px;margin-bottom:16px;scroll-margin-top:20px}
.ed-sec h2{font-size:17px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.ed-sec h2 i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--gold2);display:grid;place-items:center;font-size:12.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
.f .obr{color:var(--err)}
.f .dica{font-size:12px;color:var(--muted)}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chk label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer;background:#fbf9f5;transition:.15s}
.chk label:has(input:checked){border-color:var(--gold);background:#f6efe2;color:var(--gold3)}
.chk input{accent-color:#b99b65;width:16px;height:16px}
.drop-fotos{display:block;border:2px dashed var(--line);border-radius:16px;padding:26px;text-align:center;background:#fbf9f5;cursor:pointer;transition:.2s;margin-bottom:14px}
.drop-fotos.sobre,.drop-fotos:hover{border-color:var(--gold);background:#f6efe2}
.drop-fotos b{display:block;font-size:15px}.drop-fotos small{color:var(--muted)}
.fotos-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.fotos-g .fo{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#eee;border:2px solid transparent}
.fotos-g .fo:first-child{border-color:var(--gold)}
.fotos-g .fo img{width:100%;height:100%;object-fit:cover}
.fotos-g .fo .capa{position:absolute;left:6px;top:6px;background:var(--gold);color:#16130e;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px}
.fotos-g .fo .bt{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.fotos-g .fo .bt button{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.92);font-weight:800;font-size:14px;display:grid;place-items:center}
.ed-rod{position:sticky;bottom:0;background:rgba(247,243,236,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px 0;display:flex;gap:10px;align-items:center;margin-top:6px;z-index:5}
.ed-rod .st{margin-right:auto;display:flex;gap:16px;align-items:center;font-weight:700;font-size:14px}
.ed-rod .st label{display:flex;gap:8px;align-items:center;cursor:pointer}
.prev-preco{font-family:var(--serif);font-size:20px;color:var(--gold3);margin:-6px 0 12px}
@media (max-width:900px){.ed{grid-template-columns:1fr}.ed-nav{display:none}.g2,.g3,.g4{grid-template-columns:1fr 1fr}.ed-rod{flex-wrap:wrap}}

/* ===== IA + fluxo de aprovação ===== */
.est-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.est-tabs button{height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--muted)}
.est-tabs button b{margin-left:4px;color:var(--txt)}
.est-tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}.est-tabs button.on b{color:var(--gold2)}
.e-ras{background:#ece6f7!important;color:#5b3fa0!important}.e-conf{background:#fbf0d6!important;color:#8a5a00!important}.e-prop{background:#e3eefb!important;color:#24508f!important}.e-aprov{background:#fde7d6!important;color:#9a4a12!important}.e-pub{background:#dff1e7!important;color:#1f6b45!important}.e-rep{background:#f6dcd5!important;color:#a1361d!important}
.im-card .tx .pend{font-style:normal;color:#a1361d;font-weight:800}
.aviso-ia{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center;background:#fff7e6;border:1.5px solid #f0d9a8;border-radius:16px;padding:16px 18px;margin-bottom:16px}
.aviso-ia b{font-size:15px}.aviso-ia span{grid-column:1;color:#6d5a33;font-size:14px;line-height:1.5}.aviso-ia .btn{grid-column:2;grid-row:1/3}
.aviso-ia.mini{display:block}.aviso-ia.mini b{margin-right:6px}
.aviso-ia.rep{background:#fbe9e4;border-color:#efc4b8;display:block}.aviso-ia.rep span{color:#7a2d1a}
.ia-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ia-op{position:relative;padding:24px}.ia-op .n{position:absolute;right:18px;top:16px;font-family:var(--serif);font-size:42px;color:var(--line)}
.ia-op h3{font-size:18px;margin-bottom:8px}.ia-op p{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:14px}
.dica{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.lista-arq div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-top:6px;font-size:14px;background:#fff}
.lista-arq small{color:var(--muted);margin-left:6px}.lista-arq button{width:28px;height:28px;border-radius:8px;background:var(--paper)}
.ia-rod{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:18px}
.ia-status{color:var(--muted);font-size:14px;font-weight:600}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.fx-top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:rgba(247,243,236,.96);backdrop-filter:blur(8px);margin:-6px -6px 16px;padding:12px 6px;border-bottom:1px solid var(--line)}
.fx-id{display:flex;flex-direction:column;min-width:0}.fx-id b{font-size:17px}.fx-id small{color:var(--muted);font-size:12.5px}
.st-b{font-size:12.5px;font-weight:800;padding:6px 11px;border-radius:999px}
.prog{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.prog>div{width:160px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);transition:width .4s}
.prog button{height:30px;padding:0 12px;border-radius:999px;background:#f6dcd5;color:#a1361d;font-weight:800;font-size:12.5px}
.pend-box{background:#fff;border:1.5px solid #efc4b8;border-radius:14px;padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.pend-box>b{font-size:14px;margin-bottom:4px}.pend-box button{text-align:left;padding:8px 10px;border-radius:8px;background:#fbf3f0;font-weight:700;font-size:13.5px}.pend-box small{color:#a1361d;font-weight:600;margin-left:6px}
.cf-grid{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.cf-orig-box{position:sticky;top:84px;padding:16px;max-height:calc(100svh - 100px);overflow:auto}
.cf-orig-box h3{font-size:14px;margin-bottom:10px}.cf-orig-box .btn{width:100%;margin-bottom:10px}
.lista-o{list-style:none;font-size:13px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.lista-o li{padding:7px 9px;background:var(--paper);border-radius:8px;word-break:break-word}
.mini-g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.mini-g img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.tab-u{max-height:240px;overflow:auto}.tab-u .tabela td,.tab-u .tabela th{padding:6px;font-size:12px}
.cf-campos{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.cf.larga{grid-column:1/-1}
.cf label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cf-tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.cft-alta{background:#eef0ea;color:#5d6b55}.cft-media{background:#fbf0d6;color:#8a5a00}.cft-baixa{background:#f6dcd5;color:#a1361d}.pend-box[hidden]{display:none}
.cf.cf-media input,.cf.cf-media select,.cf.cf-media textarea{border-color:#e5b94f!important;background:#fffaf0!important}
.cf.cf-baixa input,.cf.cf-baixa select,.cf.cf-baixa textarea{border-color:#d9785d!important;background:#fff6f3!important}
.cf-orig{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:6px;font-size:12px;color:var(--muted)}
.cf-ok{height:30px!important;padding:0 10px!important;font-size:12.5px!important}
.cf-feito{color:#1f6b45;font-weight:800}.cf-o{color:#7a6a4a;font-style:italic}
.rot{display:block;font-size:13px;font-weight:700;margin:6px 0 8px}
.chk1{display:flex!important;align-items:center;gap:8px;height:44px;font-weight:600}
.hist{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.hist li{display:flex;flex-direction:column;padding:9px 12px;border-left:3px solid var(--gold);background:var(--paper);border-radius:0 8px 8px 0;font-size:13.5px}
.hist li.ed{border-left-color:var(--line)}.hist li span{color:var(--muted);font-size:12.5px}
.ed-rod{flex-wrap:wrap}.ed-rod .bloq{margin-right:auto;color:#a1361d;font-size:13px;font-weight:700;flex:1 1 200px}
.ed-rod #excluir{order:-1}
.mot{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;background:#fff;border-radius:18px;padding:22px;width:min(440px,calc(100vw - 32px));box-shadow:0 30px 80px rgba(0,0,0,.3)}
.mot h3{margin-bottom:10px}.mot textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit}.mot textarea.erro{border-color:var(--err)}
.mot .bts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.pisca{animation:pisca 1.4s}@keyframes pisca{0%,60%{box-shadow:0 0 0 4px rgba(185,155,101,.45);border-radius:12px}100%{box-shadow:none}}
@media (max-width:1000px){.cf-grid,.ia-grid{grid-template-columns:1fr}.cf-orig-box{position:static;max-height:none}.prog{margin-left:0;width:100%}.aviso-ia{grid-template-columns:1fr}.aviso-ia .btn{grid-column:1;grid-row:auto}}
@media (max-width:600px){.cf-campos{grid-template-columns:1fr}}
.toast{pointer-events:none}
.add-item{display:flex;gap:8px;margin-top:10px;max-width:520px}.add-item input{flex:1;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:#fff}
.emp-exc{color:var(--err);font-size:13px;font-weight:700;background:none;border:0;cursor:pointer;padding:6px}.emp-exc.c{background:var(--errbg);border-radius:8px}
</style>

<script>
(function(){

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ic={
 painel:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',

 x:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 zap:'<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm5.4 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.8-1.1-4.6-4-4.8-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.2-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.7-.1 1.3z"/></svg>',
 tel:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>',
 mail:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
 menu:'<svg class="ico" style="width:26px;height:26px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
 sino:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>'
};
let S={aba:'painel',filtro:{status:'',tipo:'',q:'',emp:''}};
let logado=false;try{logado=sessionStorage.getItem('rei_admin')==='1'}catch(e){}
const db=()=>Rei.db;
const novos=()=>db().leads.filter(l=>l.status==='novo'&&l.tipo!=='newsletter').length;
const quando=s=>{const d=new Date(s),m=(Date.now()-d)/6e4;if(m<1)return'agora';if(m<60)return Math.floor(m)+' min';if(m<1440)return Math.floor(m/60)+' h';return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})};
const dataHora=s=>new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const dig=s=>String(s||'').replace(/\D/g,'');
const ini=n=>String(n||'?').trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase();
let tt;function toast(t,s){const e=$('#toast');e.innerHTML=`<b>${esc(t)}</b>${s?esc(s):''}`;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),4200)}

function telaLogin(){
  R.innerHTML=`<div class="login"><form class="box" id="fLogin"><img src="logo-cor.png" alt="Rei dos Imóveis"><h1>Painel</h1><p>Contatos, empreendimentos e conteúdo do site.</p>
  <div class="f"><label>E-mail</label><input type="email" name="email" autocomplete="username" required></div>
  <div class="f"><label>Senha</label><input type="password" name="senha" autocomplete="current-password" required></div>
  <button class="btn b-escuro" style="width:100%">Entrar</button><span class="demo-tag">Prévia: qualquer e-mail e senha entram</span></form></div>`;
  $('#fLogin').onsubmit=async e=>{e.preventDefault();const em=e.target.email.value.trim().toLowerCase(),se=e.target.senha.value;
    if(Rei.entrar){const b=$('#fLogin button');b.disabled=true;b.textContent='Entrando...';const r=await Rei.entrar(em,se);if(r.erro){b.disabled=false;b.textContent='Entrar';let x=$('#fLogin .erro-login');if(!x){x=document.createElement('p');x.className='erro-login';x.style.cssText='color:var(--err);font-weight:700;font-size:14px;margin-top:12px';$('#fLogin').append(x)}x.textContent=r.erro;return}}
    logado=true;USUARIO=em;conhecidos=new Set(db().leads.map(l=>l.id));try{sessionStorage.setItem('rei_admin','1');sessionStorage.setItem('rei_user',USUARIO)}catch(er){}app()};
  if(Rei.modo==='supabase'){const t=$('.demo-tag');if(t)t.remove()}
}
const PAPEIS={corretor:'Corretor',gerente:'Gerente',administrador:'Administrador'};
const papel=()=>Rei.papel?Rei.papel():'administrador';
const gestor=()=>['administrador','gerente'].includes(papel());
const nomeDe=em=>{const m=(db().equipe||[]).find(x=>x.email===em);return m?(m.nome||m.email):(em||'')};
function abas(){const p=papel();const todas=[['painel','Painel',ic.painel,'cga'],['contatos','Contatos',ic.contatos,'cga'],['imoveis','Imóveis',ic.emp,'cga'],['emp','Lançamentos parceiros',ic.emp,'ga'],['materiais','Materiais',ic.mat,'ga'],['blog','Blog',ic.blog,'ga'],['news','Newsletter',ic.news,'ga'],['equipe','Equipe',ic.contatos,'a'],['cfg','Configurações',ic.cfg,'a']];return todas.filter(a=>a[3].includes(p[0]))}
function equipeTela(){
  const E=db().equipe||[];const conta={};db().leads.forEach(l=>{if(l.corretor)conta[l.corretor]=(conta[l.corretor]||0)+1});
  $('#main').innerHTML=`<div class="top"><div><h1>Equipe</h1><div class="sub">Cadastre corretores e gerentes. Os contatos do site são distribuídos automaticamente entre os corretores ativos, em rodízio.</div></div></div>
  <div class="g2" style="align-items:start"><div class="card"><h3>Pessoas com acesso</h3>
    <div class="lista">${E.map(m=>`<div class="item" style="cursor:default"><div class="av">${esc(ini(m.nome||m.email))}</div><div style="min-width:0"><b>${esc(m.nome||m.email)}</b> <span class="tag ${m.ativo===false?'t-perdido':m.papel==='administrador'?'t-fechado':m.papel==='gerente'?'t-proposta':'t-atendimento'}">${m.ativo===false?'Desativado':PAPEIS[m.papel]}</span><br><small style="color:var(--muted)">${esc(m.email)}${m.papel==='corretor'?' · '+(conta[m.email]||0)+' contato'+((conta[m.email]||0)===1?'':'s'):''}</small></div>
      ${m.email===quem()?'<small style="color:var(--muted)">você</small>':`<div style="display:flex;gap:6px;align-items:center"><select data-pp="${esc(m.email)}" style="height:36px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px">${Object.entries(PAPEIS).map(([k,t])=>`<option value="${k}" ${m.papel===k?'selected':''}>${t}</option>`).join('')}</select><button class="btn ${m.ativo===false?'b-escuro':'b-erro'}" style="height:36px;padding:0 12px;font-size:13px" data-at="${esc(m.email)}">${m.ativo===false?'Reativar':'Desativar'}</button></div>`}</div>`).join('')||'<p style="color:var(--muted)">Ninguém cadastrado ainda.</p>'}</div></div>
  <div class="card"><h3>Cadastrar pessoa</h3><form id="fEq" novalidate>
    <div class="f"><label>Nome</label><input name="nome" required></div>
    <div class="f"><label>E-mail (é o login)</label><input name="email" type="email" required></div>
    <div class="f"><label>WhatsApp</label><input name="telefone" inputmode="tel" placeholder="(47) 90000-0000"></div>
    <div class="f"><label>Perfil</label><select name="papel"><option value="corretor">Corretor: vê só os próprios contatos e imóveis; não aprova</option><option value="gerente">Gerente: vê tudo e aprova imóveis</option><option value="administrador">Administrador: acesso total</option></select></div>
    <div class="f"><label>Senha inicial</label><input name="senha" type="text" minlength="6" placeholder="Mínimo 6 caracteres"><small class="dica">Passe a senha para a pessoa. Ela entra em ${esc(location.host||'')}/admin.html.</small></div>
    <p class="erro-eq" style="color:var(--err);font-weight:700;font-size:14px"></p>
    <button class="btn b-escuro" type="submit">Cadastrar</button></form></div></div>`;
  $('#fEq').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const d=Object.fromEntries(f);if(!d.nome.trim()){$('.erro-eq').textContent='Informe o nome.';return}
    const b=$('#fEq button[type=submit]');b.disabled=true;b.textContent='Cadastrando...';const r=await Rei.cadastrarMembro(d);b.disabled=false;b.textContent='Cadastrar';
    if(r.erro){$('.erro-eq').textContent=r.erro;return}toast(d.nome.trim()+' cadastrado',r.jaExistia?'Esse e-mail já tinha login: a senha dele continua a mesma.':'Já pode entrar no painel com o e-mail e a senha.');equipeTela()};
  $$('[data-pp]').forEach(s=>s.onchange=async()=>{const r=await Rei.atualizarMembro(s.dataset.pp,{papel:s.value});toast(r.erro?r.erro:'Perfil atualizado');equipeTela()});
  $$('[data-at]').forEach(b=>b.onclick=async()=>{const m=(db().equipe||[]).find(x=>x.email===b.dataset.at);const r=await Rei.atualizarMembro(m.email,{ativo:m.ativo===false});toast(r.erro?r.erro:(m.ativo===false?'Acesso reativado':'Acesso desativado'));equipeTela()});
}
function app(){
  R.innerHTML=`<div class="mob-top"><img src="logo-claro.png" alt=""><button id="abrirSide">${ic.menu}</button></div><div class="app"><aside class="side" id="side"><div class="lg"><img src="logo-claro.png" alt="Rei dos Imóveis"></div>
  ${abas().map(([k,t,i])=>`<button data-aba="${k}" class="${S.aba===k?'on':''}">${i}${t}${k==='contatos'&&novos()?`<b>${novos()}</b>`:''}</button>`).join('')}
  <div class="pe"><a href="index.html" target="_blank">Ver o site ↗</a><br><button id="sair">Sair</button></div></aside><main class="main" id="main"></main></div>`;
  $$('[data-aba]').forEach(b=>b.onclick=()=>{S.aba=b.dataset.aba;$('#side').classList.remove('on');app()});
  $('#sair').onclick=async()=>{logado=false;try{sessionStorage.removeItem('rei_admin');sessionStorage.removeItem('rei_user')}catch(e){}if(Rei.sair)await Rei.sair();telaLogin()};
  $('#abrirSide').onclick=()=>$('#side').classList.toggle('on');
  if(!abas().some(a=>a[0]===S.aba))S.aba='painel';
  ({painel,contatos,imoveis:imoveisTela,emp:empTela,materiais,blog,news,cfg:config,equipe:equipeTela})[S.aba]();
  document.title=(novos()?`(${novos()}) `:'')+'Painel | Rei dos Imóveis';

function avisoNotif(){
  if(!('Notification' in window)||Notification.permission==='granted')return'';
  return `<div class="aviso">${ic.sino}<span>Ative as notificações para ser avisado na hora em que chegar um contato novo.</span><button id="ativarNotif">Ativar notificações</button></div>`;
}
function ligarAviso(){const b=$('#ativarNotif');if(b)b.onclick=()=>Notification.requestPermission().then(()=>app())}
function painel(){
  const L=db().leads.filter(l=>l.tipo!=='newsletter');const mes=new Date();mes.setDate(1);mes.setHours(0,0,0,0);
  const doMes=L.filter(l=>new Date(l.criado_em)>=mes).length;
  const books=L.filter(l=>l.tipo==='book'||l.tipo==='tabela').length;const fech=L.filter(l=>l.status==='fechado').length;
  const dias=[...Array(14)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-13+i);return d});
  const porDia=dias.map(d=>L.filter(l=>{const x=new Date(l.criado_em);return x>=d&&x<new Date(d.getTime()+864e5)}).length);const mx=Math.max(1,...porDia);
  const porEmp={};L.forEach(l=>{if(l.empreendimento)porEmp[l.empreendimento]=(porEmp[l.empreendimento]||0)+1});
  const rank=Object.entries(porEmp).sort((a,b)=>b[1]-a[1]).slice(0,6);const rmx=Math.max(1,...rank.map(r=>r[1]));
  $('#main').innerHTML=`<div class="top"><div><h1>Olá, ${esc(db().config.corretor||'Ciro')}</h1><div class="sub">Resumo dos contatos que chegaram pelo site.</div></div><div class="acoes"><button class="btn b-linha" data-ir="contatos">Ver contatos</button></div></div>
  ${avisoNotif()}

  const motivo=(titulo,fn)=>{const ov=document.createElement('div');ov.className='ov on';const d=document.createElement('div');d.className='mot';d.innerHTML=`<h3>${titulo}</h3><textarea id="motTx" rows="4" placeholder="Escreva o motivo (obrigatório)"></textarea><div class="bts"><button class="btn b-linha" id="motNao">Cancelar</button><button class="btn b-escuro" id="motSim">Confirmar</button></div>`;document.body.append(ov,d);$('#motTx',d).focus();const fecha=()=>{ov.remove();d.remove()};$('#motNao',d).onclick=fecha;ov.onclick=fecha;$('#motSim',d).onclick=()=>{const t=$('#motTx',d).value.trim();if(t.length<4){$('#motTx',d).classList.add('erro');return}fecha();fn(t)}};
  $$('[data-ac]').forEach(b=>b.onclick=()=>{
    if(editavel)colher();const blq=bloqDe(b.dataset.ac);if(blq){$('#bloq').textContent=blq;if(b.dataset.ac==='paraProp'||b.dataset.ac==='paraAprov'){$('#pendBox').hidden=false;$('#pendBox').scrollIntoView({behavior:'smooth',block:'center'})}return}
    const ac=b.dataset.ac;if(editavel)colher();
    const vai=(para,mot,msg)=>{if(!transicao(m,para,mot))return toast('Sem espaço para salvar','Remova algumas fotos');toast(msg);ficha(m)};
    if(ac==='salvar'){if(Rei.salvarImovel(m))toast('Salvo','Você pode continuar depois do mesmo ponto');ficha(m)}
    else if(ac==='abrir')vai('conferencia','','Conferência aberta');
    else if(ac==='reenviar')vai('rascunho_ia','Material de origem incorreto, reenviar','Voltou para Rascunho IA');
    else if(ac==='paraProp')vai('aguardando_prop','','Agora preencha os dados do proprietário');
    else if(ac==='paraAprov')vai('aguardando_aprov','','Enviado para aprovação');
    else if(ac==='aprovar')vai('publicado','','Aprovado e publicado no site');
    else if(ac==='reprovar')motivo('Motivo da reprovação',t=>vai('reprovado',t,'Reprovado e devolvido ao responsável'));
    else if(ac==='despublicar')motivo('Motivo da despublicação',t=>vai('conferencia',t,'Saiu do site e voltou para conferência'));
    else if(ac==='corrigir')vai('conferencia','Correções em andamento','Voltou para conferência');
  });
  const ex=$('#excluir');if(ex)ex.onclick=()=>motivo('Motivo da exclusão',t=>{m.excluido=true;m.hist.push({de:m.estado,para:m.estado,autor:quem(),em:agoraI(),motivo:'Excluído: '+t});Rei.salvarImovel(m);toast('Imóvel excluído','O histórico fica guardado');imoveisTela()});
}

function empTela(){
  const conta={};db().leads.forEach(l=>{if(l.slug)conta[l.slug]=(conta[l.slug]||0)+1});
  $('#main').innerHTML=`<div class="top"><div><h1>Lançamentos parceiros</h1><div class="sub">Os empreendimentos que já estavam no site. Clique em Editar para mudar nome, textos, fase, valor e foto de capa.</div></div></div>
  <div class="card" style="padding:8px 16px;overflow-x:auto"><table class="tabela"><thead><tr><th></th><th>Empreendimento</th><th>Fase</th><th>A partir de</th><th>Destaque</th><th>No site</th><th>Pedidos</th><th></th></tr></thead><tbody>
  ${EMP.filter(e0=>!Rei.empOverride(e0.slug).excluido).map(e0=>{const o=Rei.empOverride(e0.slug);const e=Object.assign({},e0,o);const at=o.ativo!==false;return`<tr><td><img src="${esc(e.capa)}" alt=""></td><td><b>${esc(e.nome)}</b><br><small style="color:var(--muted)">${esc(e.local)}</small></td>
  <td><select data-est="${e.slug}">${ESTAGIOS.map(s=>`<option ${e.estagio===s?'selected':''}>${s}</option>`).join('')}</select></td>
  <td><input data-preco="${e.slug}" placeholder="Ex.: R$ 1,2 mi" value="${esc(o.aPartirDe||'')}"></td>
  <td><input type="radio" name="dest" data-dest="${e.slug}" ${db().config.destaque===e.slug?'checked':''} style="width:20px;height:20px;accent-color:#b99b65"></td>
  <td><button class="sw ${at?'on':''}" data-at="${e.slug}" aria-label="Mostrar no site"></button></td><td><b>${conta[e.slug]||0}</b> <a href="index.html#/imovel/${e.slug}" target="_blank" style="color:var(--gold3);font-size:13px;margin-left:6px">ver ↗</a></td><td><button class="btn b-escuro" style="height:34px;padding:0 12px;font-size:13px" data-edp="${e.slug}">Editar</button> <button class="emp-exc" data-exc="${e.slug}">Excluir</button></td></tr>`}).join('')}
  </tbody></table></div>${EMP.some(e=>Rei.empOverride(e.slug).excluido)?`<div class="card" style="margin-top:14px"><h3>Excluídos</h3><p style="font-size:13.5px;color:var(--muted);margin:4px 0 10px">Não aparecem no site nem nesta lista. Clique para restaurar.</p>${EMP.filter(e=>Rei.empOverride(e.slug).excluido).map(e=>`<button class="btn b-linha" style="height:34px;margin:0 6px 6px 0;font-size:13px" data-rest="${e.slug}">↺ ${esc(Rei.empOverride(e.slug).nome||e.nome)}</button>`).join('')}</div>`:''}`;
  $$('[data-exc]').forEach(b=>b.onclick=()=>{if(!b.classList.contains('c')){b.classList.add('c');b.textContent='Confirmar exclusão';setTimeout(()=>{if(b.isConnected){b.classList.remove('c');b.textContent='Excluir'}},4000);return}Rei.setEmp(b.dataset.exc,{excluido:true,ativo:false});toast('Lançamento excluído','Saiu do site. Dá para restaurar no fim da lista.');empTela()});
  $$('[data-rest]').forEach(b=>b.onclick=()=>{Rei.setEmp(b.dataset.rest,{excluido:false,ativo:true});toast('Lançamento restaurado');empTela()});
  $$('[data-est]').forEach(s=>s.onchange=()=>{Rei.setEmp(s.dataset.est,{estagio:s.value});toast('Fase atualizada')});
  $$('[data-preco]').forEach(s=>s.onchange=()=>{Rei.setEmp(s.dataset.preco,{aPartirDe:s.value.trim()});toast('Valor atualizado')});
  $$('[data-dest]').forEach(s=>s.onchange=()=>{Rei.setConfig({destaque:s.dataset.dest});toast('Destaque da página inicial atualizado')});
  $$('[data-at]').forEach(b=>b.onclick=()=>{const on=!b.classList.contains('on');b.classList.toggle('on',on);Rei.setEmp(b.dataset.at,{ativo:on});toast(on?'Visível no site':'Oculto do site')});
  $$('[data-edp]').forEach(b=>b.onclick=()=>{const e0=EMP.find(x=>x.slug===b.dataset.edp),o=Rei.empOverride(e0.slug),e=Object.assign({},e0,o);
    modalForm('Editar '+esc(e.nome),`<div class="f"><label>Nome</label><input id="pNome" value="${esc(e.nome)}"></div>
      <div class="f"><label>Local (bairro · cidade)</label><input id="pLocal" value="${esc(e.local)}"></div>
      <div class="f"><label>Frase do card</label><textarea id="pCard" rows="3">${esc(e.resumoCard||'')}</textarea></div>
      <div class="f"><label>Título da página</label><input id="pTit" value="${esc(e.titulo||'')}"></div>
      <div class="f"><label>Texto de abertura da página</label><textarea id="pRes" rows="4">${esc(e.resumo||'')}</textarea></div>
      <div class="f"><label>Tipo</label><select id="pTipo">${['Apartamento','Casa','Lote','Uso misto','Comercial'].map(t=>`<option ${e.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="f"><label>A partir de</label><input id="pPreco" value="${esc(o.aPartirDe||'')}" placeholder="Ex.: R$ 1,2 mi"></div>
      ${seletorImg(e.capa,'pImg')}<div class="f"><label>Ou enviar outra foto de capa</label><input type="file" id="pUp" accept="image/*"></div>
      ${o.capa||o.nome||o.resumo?'<button type="button" class="btn b-linha" id="pVolta" style="margin-bottom:10px">Voltar aos textos originais</button>':''}`,
    d=>{const mud={nome:$('#pNome',d).value.trim()||e0.nome,local:$('#pLocal',d).value.trim(),resumoCard:$('#pCard',d).value.trim(),titulo:$('#pTit',d).value.trim(),resumo:$('#pRes',d).value.trim(),tipo:$('#pTipo',d).value,aPartirDe:$('#pPreco',d).value.trim(),capa:d.dataset.capa||$('#pImg',d).value};mud.bg=mud.capa;Rei.setEmp(e0.slug,mud);toast('Empreendimento atualizado','Já aparece assim no site')});
    const d=$('.drawer:last-of-type')||document.querySelector('.drawer');
    const up=$('#pUp',d);if(up)up.onchange=async ev=>{const f=ev.target.files[0];if(!f)return;d.dataset.capa=await comprimir(f);$('#pImgP',d).src=d.dataset.capa};
    const pv=$('#pVolta',d);if(pv)pv.onclick=()=>{['nome','local','resumoCard','titulo','resumo','tipo','capa','bg'].forEach(k=>delete db().emp[e0.slug][k]);Rei.setEmp(e0.slug,{});toast('Textos originais de volta');d.querySelector('.x').click()};
  });
}
const IMGS=[...new Set(EMP.flatMap(e=>[e.capa,...(e.fotos||[]).map(f=>f.src)]).filter(Boolean))];
const slugify=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function seletorImg(atual,id,comUpload){const ext=atual&&!IMGS.includes(atual);return `<div class="f"><label>Imagem de capa</label>${comUpload?`<label class="btn b-ouro" style="cursor:pointer;width:100%;margin-bottom:8px">⬆ Enviar imagem do computador<input type="file" accept="image/*" data-up="${id}" hidden></label><small class="dica" style="display:block;margin-bottom:6px">Ou escolha uma das imagens do site:</small>`:''}<select id="${id}">${ext?`<option value="${esc(atual)}" selected>Imagem enviada</option>`:''}${IMGS.map(s=>`<option value="${esc(s)}" ${s===atual?'selected':''}>${esc(EMP.find(e=>e.capa===s||(e.fotos||[]).some(f=>f.src===s))?.nome||'')} · ${esc(s.slice(-14))}</option>`).join('')}</select><img id="${id}P" src="${esc(atual||IMGS[0])}" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px"></div>`}
function modalForm(titulo,corpo,salvar,excluir){
  const ov=document.createElement('div');ov.className='ov';const d=document.createElement('div');d.className='drawer';
  d.innerHTML=`<div class="hd"><h2>${titulo}</h2><button class="x">${ic.x}</button></div><div class="bd">${corpo}<div class="bts" style="margin-top:10px"><button class="btn b-escuro" id="ok">Salvar</button>${excluir?'<button class="btn b-erro" id="exc" style="margin-left:auto">Excluir</button>':''}</div></div>`;
  const fecha=()=>{d.classList.remove('on');ov.classList.remove('on');setTimeout(()=>{d.remove();ov.remove()},300)};
  ov.onclick=fecha;$('.x',d).onclick=fecha;document.body.append(ov,d);requestAnimationFrame(()=>{ov.classList.add('on');d.classList.add('on')});
  $$('select[id$="Img"]',d).forEach(s=>s.onchange=()=>{delete d.dataset.capa;$('#'+s.id+'P',d).src=s.value});
  $$('[data-up]',d).forEach(inp=>inp.onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{d.dataset.capa=await comprimir(f);$('#'+inp.dataset.up+'P',d).src=d.dataset.capa;toast('Imagem carregada','Ela é enviada quando você clicar em Salvar')}catch(e){toast('Não foi possível ler essa imagem')}});
  $('#ok',d).onclick=()=>{if(salvar(d)!==false){fecha();app()}};if(excluir)$('#exc',d).onclick=e=>{const b=e.currentTarget;if(b.dataset.c){excluir();fecha();app()}else{b.dataset.c=1;b.textContent='Clique de novo para excluir'}};
}
function materiais(){
  const M=db().materiais;
  $('#main').innerHTML=`<div class="top"><div><h1>Materiais</h1><div class="sub">Materiais gratuitos do site. O cliente deixa os dados para liberar o acesso, e o contato cai em Contatos.</div></div><div class="acoes"><button class="btn b-ouro" id="novo">Novo material</button></div></div>
  <div class="grid-c">${M.map(m=>`<div class="card cpost" data-m="${m.id}" style="cursor:pointer"><img src="${esc(m.capa)}" alt=""><div class="in"><small>${m.ativo!==false?'Publicado':'Oculto'}</small><b>${esc(m.titulo)}</b><small>${esc(m.resumo)}</small></div></div>`).join('')||'<div class="vazio"><b>Nenhum material</b></div>'}</div>`;
  const edita=m=>{const novo=!m;m=m||{id:Rei.uid(),ativo:true,capa:IMGS[0]};
    modalForm(novo?'Novo material':'Editar material',`<div class="f"><label>Título</label><input id="mt" value="${esc(m.titulo||'')}"></div><div class="f"><label>Resumo</label><textarea id="mr">${esc(m.resumo||'')}</textarea></div><div class="f"><label>Link do material (Google Drive, PDF...)</label><input id="ml" value="${esc(m.link||'')}" placeholder="https://"></div>${seletorImg(m.capa,'mImg',1)}<label style="display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;margin:6px 0 12px"><input type="checkbox" id="ma" ${m.ativo!==false?'checked':''}> Publicado no site</label>`,
    d=>{const t=$('#mt',d).value.trim();if(!t){toast('Informe o título');return false}Rei.salvarMaterial(Object.assign(m,{titulo:t,slug:m.slug||slugify(t),resumo:$('#mr',d).value.trim(),link:$('#ml',d).value.trim(),capa:d.dataset.capa||$('#mImg',d).value,ativo:$('#ma',d).checked}));toast('Material salvo')},novo?null:()=>Rei.excluirMaterial(m.id))};
  $('#novo').onclick=()=>edita();$$('[data-m]').forEach(c=>c.onclick=()=>edita(M.find(x=>x.id===c.dataset.m)));
}
function blog(){
  const P=db().posts;
  $('#main').innerHTML=`<div class="top"><div><h1>Blog</h1><div class="sub">Publique artigos no site. Use ## no começo da linha para criar um subtítulo.</div></div><div class="acoes"><button class="btn b-ouro" id="novo">Novo artigo</button></div></div>
  <div class="grid-c">${P.map(p=>`<div class="card cpost" data-p="${p.id}" style="cursor:pointer"><img src="${esc(p.capa)}" alt=""><div class="in"><small>${esc(p.categoria)} · ${new Date(p.data+'T12:00').toLocaleDateString('pt-BR')}</small><b>${esc(p.titulo)}</b><small>${esc(p.resumo)}</small></div></div>`).join('')}</div>`;
  const edita=p=>{const novo=!p;p=p||{id:Rei.uid(),data:new Date().toISOString().slice(0,10),categoria:'Mercado imobiliário',capa:IMGS[0],corpo:[]};
    modalForm(novo?'Novo artigo':'Editar artigo',`<div class="f"><label>Título</label><input id="pt" value="${esc(p.titulo||'')}"></div><div class="f"><label>Categoria</label><input id="pc" value="${esc(p.categoria)}" list="cats"><datalist id="cats"><option>Mercado imobiliário</option><option>Guia do comprador</option><option>Investimento imobiliário</option></datalist></div><div class="f"><label>Data</label><input type="date" id="pd" value="${esc(p.data)}"></div><div class="f"><label>Resumo (aparece no card)</label><textarea id="pr" style="min-height:80px">${esc(p.resumo||'')}</textarea></div>${seletorImg(p.capa,'pImg',1)}<div class="f"><label>Texto do artigo (um parágrafo por linha; ## para subtítulo)</label><textarea id="pb" style="min-height:260px">${esc((p.corpo||[]).join('\n\n'))}</textarea></div>`,
    d=>{const t=$('#pt',d).value.trim();if(!t){toast('Informe o título');return false}Rei.salvarPost(Object.assign(p,{titulo:t,slug:p.slug||slugify(t),categoria:$('#pc',d).value.trim()||'Mercado imobiliário',data:$('#pd',d).value||p.data,resumo:$('#pr',d).value.trim(),capa:d.dataset.capa||$('#pImg',d).value,corpo:$('#pb',d).value.split(/\n+/).map(x=>x.trim()).filter(Boolean)}));toast('Artigo publicado')},novo?null:()=>Rei.excluirPost(p.id))};
  $('#novo').onclick=()=>edita();$$('[data-p]').forEach(c=>c.onclick=()=>edita(P.find(x=>x.id===c.dataset.p)));
}
function news(){
  const L=db().leads.filter(l=>l.tipo==='newsletter');
  $('#main').innerHTML=`<div class="top"><div><h1>Newsletter</h1><div class="sub">${L.length} inscrito${L.length===1?'':'s'} para receber novidades por e-mail.</div></div><div class="acoes"><button class="btn b-linha" id="csv">Exportar (CSV)</button></div></div>
  <div class="card">${L.length?`<table class="tabela"><thead><tr><th>Nome</th><th>E-mail</th><th>Data</th></tr></thead><tbody>${L.map(l=>`<tr><td><b>${esc(l.nome)}</b></td><td>${esc(l.email)}</td><td>${dataHora(l.criado_em)}</td></tr>`).join('')}</tbody></table>`:'<div class="vazio"><b>Nenhum inscrito ainda</b>Os inscritos do rodapé e do blog aparecem aqui.</div>'}</div>`;
  $('#csv').onclick=()=>baixarCSV(L,'newsletter-rei-dos-imoveis.csv');
}
function config(){
  const c=db().config;
  $('#main').innerHTML=`<div class="top"><div><h1>Configurações</h1><div class="sub">Dados que aparecem no site.</div></div></div>
  <div class="g2"><div class="card"><div class="g2" style="grid-template-columns:1fr 1fr;gap:12px"><div class="f"><label>Nome do corretor</label><input id="c1" value="${esc(c.corretor)}"></div><div class="f"><label>CRECI</label><input id="c2" value="${esc(c.creci)}" placeholder="Ex.: 41.418"></div><div class="f"><label>Telefone</label><input id="c3" value="${esc(c.telefone)}"></div><div class="f"><label>E-mail</label><input id="c4" value="${esc(c.email)}"></div></div>
  <div class="f"><label>Instagram</label><input id="c5" value="${esc(c.instagram)}"></div><div class="f"><label>YouTube</label><input id="c6" value="${esc(c.youtube)}"></div><button class="btn b-escuro" id="salvar">Salvar</button>
  </div>
  <div class="card"><h3>Foto do ${esc(c.corretor||'corretor')}</h3><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><img class="foto-prev" src="${esc(c.foto||'coroa.png')}" alt="" style="${c.foto?'':'object-fit:contain;padding:20px'}"><div><p style="font-size:13.5px;color:var(--muted);margin-bottom:10px">Aparece na página inicial e em Quem somos. Use uma foto vertical, de preferência com fundo neutro.</p><label class="btn b-linha" style="cursor:pointer">Escolher foto<input type="file" id="foto" accept="image/*" hidden></label>${c.foto?' <button class="btn b-erro" id="tiraFoto">Remover</button>':''}</div></div>
  ${Rei.modo==='supabase'?'':`<h3 style="margin-top:26px">Prévia</h3><p style="font-size:13.5px;color:var(--muted);margin-bottom:10px">Nesta prévia os dados ficam salvos só neste navegador. Na versão publicada, tudo fica no banco de dados com login seguro.</p><button class="btn b-erro" id="reset">Apagar dados de teste</button>`}</div></div>`;
  $('#salvar').onclick=()=>{Rei.setConfig({corretor:$('#c1').value.trim()||'Ciro',creci:$('#c2').value.trim(),telefone:$('#c3').value.trim(),email:$('#c4').value.trim(),instagram:$('#c5').value.trim(),youtube:$('#c6').value.trim()});toast('Configurações salvas')};
  $('#foto').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const k=Math.min(1,900/img.height);const cv=document.createElement('canvas');cv.width=img.width*k;cv.height=img.height*k;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);Rei.setConfig({foto:cv.toDataURL('image/webp',.85)});toast('Foto atualizada');app()};img.src=URL.createObjectURL(f)};
  const tf=$('#tiraFoto');if(tf)tf.onclick=()=>{Rei.setConfig({foto:''});app()};
  if($('#reset'))$('#reset').onclick=e=>{const b=e.currentTarget;if(b.dataset.c){Rei.resetarDemo();toast('Dados de teste apagados');app()}else{b.dataset.c=1;b.textContent='Clique de novo para apagar tudo'}};
}
// notificações em tempo real (outra aba / site)
let conhecidos=new Set(db().leads.map(l=>l.id));
Rei.aoMudar(externo=>{if(!externo)return;const novos2=db().leads.filter(l=>!conhecidos.has(l.id));conhecidos=new Set(db().leads.map(l=>l.id));
  novos2.forEach(l=>{const t=l.tipo==='newsletter'?'Nova inscrição na newsletter':'Novo contato: '+l.nome;const s=(TIPOS[l.tipo]||'')+(l.empreendimento?' · '+l.empreendimento:'');toast(t,s);
    try{if('Notification' in window&&Notification.permission==='granted')new Notification(t,{body:s,icon:'coroa.png'})}catch(e){}
    try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);o.start();o.stop(a.currentTime+.5)}catch(e){}});
  if(logado&&!$('.drawer')&&!$('#fFicha')&&!$('#ler'))app()});
window.addEventListener('rei-erro',e=>toast(e.detail,'Nada foi perdido na tela; tente salvar de novo.'));
if(Rei.modo==='supabase'){R.innerHTML='<div class="login"><div class="box" style="text-align:center"><img src="logo-cor.png" alt="Rei dos Imóveis"><p style="margin-top:16px">Carregando...</p></div></div>';
  Rei.pronto.then(()=>{logado=Rei.sessao();USUARIO=Rei.usuario();try{sessionStorage.setItem('rei_user',USUARIO)}catch(e){}conhecidos=new Set(db().leads.map(l=>l.id));logado?app():telaLogin()});}
else logado?app():telaLogin();
})();
</script>
